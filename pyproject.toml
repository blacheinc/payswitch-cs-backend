[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "payswitch-credit-scoring"
version = "0.1.0"
description = "PaySwitch Credit Scoring Platform - Backend API"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.31",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Azure SDKs
    "azure-storage-blob>=12.20.0",
    "azure-servicebus>=7.12.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-identity>=1.17.0",
    # Security floors for transitive Azure/FastAPI dependencies. Keep these
    # explicit so fresh container builds cannot resolve known-vulnerable ranges.
    "cryptography>=48.0.1",
    "idna>=3.15",
    "PyJWT>=2.13.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==3.2.2",
    "pyotp>=2.9.0",
    # Redis
    "redis[hiredis]>=5.0.0",
    # HTTP Client
    "httpx>=0.27.0",
    # Configuration
    "pydantic-settings>=2.14.2",
    # File processing
    "openpyxl>=3.1.0",
    # PDF generation
    "reportlab>=4.2.0",
    # Email
    "resend>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "types-openpyxl>=3.1.5",
    "types-python-jose>=3.5.0",
    "types-passlib>=1.7.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false

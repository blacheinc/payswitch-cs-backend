# HorizontalPodAutoscaler for the API.
#
# Each pod hosts 5 in-process batch workers, so total concurrency
# scales linearly with replicas.  CPU is the most portable trigger —
# every cluster has metrics-server.  Cluster operators with
# Prometheus + the custom-metrics adapter can swap this for a
# concurrent-requests-per-pod metric for tighter control.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payswitch-api
  namespace: payswitch-credit-scoring
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payswitch-api
  minReplicas: 2     # never scale to zero — batch workers must stay alive
  maxReplicas: 10
  behavior:
    scaleDown:
      # Don't thrash — wait 5 min before scaling down so a burst doesn't
      # immediately undo itself.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
        # Pick whichever policy permits the larger scale-up.
        - type: Pods
          value: 4
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

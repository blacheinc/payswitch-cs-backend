# External Secrets Operator integration with Azure Key Vault.
#
# Use this manifest INSTEAD of secret.example.yaml when the cluster has
# External Secrets Operator (ESO) installed.  ESO syncs the listed
# secrets from Azure KV into a regular k8s Secret (named below in
# `target.name`), which the Deployment then mounts via envFrom.
#
# Prerequisites in the cluster:
#   1. ESO installed (helm install external-secrets external-secrets/external-secrets ...)
#   2. A SecretStore (or ClusterSecretStore) named `azure-kv` pointing at
#      the relevant Azure Key Vault, authenticated via a service principal
#      stored in a small bootstrap Secret OR via workload-identity.
#
# The remoteRef.key values match the kebab-case secret names the app's
# Phase-B KV source produces (see app/config/keyvault_source.py).  Don't
# rename either side without updating both.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payswitch-secrets-from-kv
  namespace: payswitch-credit-scoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore           # or ClusterSecretStore depending on setup
    name: azure-kv
  target:
    # Resulting in-cluster Secret name — must match the envFrom in
    # deployment.yaml.
    name: payswitch-secrets
    creationPolicy: Owner
  data:
    # ── Database / infra
    - secretKey: DATABASE_URL
      remoteRef:
        key: database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: redis-url
    - secretKey: AZURE_SERVICEBUS_CONNECTION_STRING
      remoteRef:
        key: azure-servicebus-connection-string
    - secretKey: AZURE_STORAGE_CONNECTION_STRING
      remoteRef:
        key: azure-storage-connection-string
    - secretKey: CHAMPION_STORAGE_CONNECTION_STRING
      remoteRef:
        key: champion-storage-connection-string

    # ── Auth
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: jwt-secret-key

    # ── External services
    - secretKey: XDS_USERNAME
      remoteRef:
        key: xds-username
    - secretKey: XDS_PASSWORD
      remoteRef:
        key: xds-password
    - secretKey: DE_INFERENCE_CODE
      remoteRef:
        key: de-inference-code
    - secretKey: ORCHESTRATOR_FUNCTION_KEY
      remoteRef:
        key: orchestrator-function-key
    - secretKey: CUSTOMER_SERVICE_FUNCTION_KEY
      remoteRef:
        key: customer-service-function-key

    # ── Email
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: resend-api-key

    # ── Bootstrap admin (one-time use; ok to remove after first deploy)
    - secretKey: BOOTSTRAP_ADMIN_PASSWORD
      remoteRef:
        key: bootstrap-admin-password

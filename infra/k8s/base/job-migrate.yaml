# Pre-sync database migration Job.
#
# Run as an Argo CD Sync Hook (PreSync) — Argo waits for the Job to
# succeed before applying the new Deployment.  Failed migrations block
# traffic from ever touching the new image.
#
# This hook is the sole migration/bootstrap owner. Application pods have
# RUN_DB_MIGRATIONS and RUN_BOOTSTRAP_ADMIN disabled in the ConfigMap.
#
# Idempotent: Argo deletes + recreates the Job on every sync because of
# the BeforeHookCreation policy below, so the Job name doesn't need to
# encode the revision.
apiVersion: batch/v1
kind: Job
metadata:
  name: payswitch-migrate
  namespace: payswitch-credit-scoring
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1     # one retry, then fail the sync — don't loop forever
  ttlSecondsAfterFinished: 86400  # keep completed Jobs for 24 h for inspection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payswitch-api
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.gitlab.com/your-org/payswitch-credit-scoring:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Skip the entrypoint's bootstrap-admin step — only run migrations.
          command:
            - "sh"
            - "-c"
            - "alembic upgrade head && python scripts/create_superuser.py"
          envFrom:
            - configMapRef:
                name: payswitch-config
            - secretRef:
                name: payswitch-secrets
          env:
            # Prevent the image entrypoint from running these before the Job's
            # explicit command. The command above remains the single owner.
            - name: RUN_DB_MIGRATIONS
              value: "false"
            - name: RUN_BOOTSTRAP_ADMIN
              value: "false"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

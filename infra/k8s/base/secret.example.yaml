# EXAMPLE — do NOT commit real values.  Replace with one of:
#   1. A Secret produced by External Secrets Operator (see external-secret.yaml)
#   2. A SealedSecret committed via the Bitnami sealed-secrets controller
#   3. A Secret created out-of-band by GitLab CI (kubectl create secret)
#   4. A SOPS-encrypted Secret + Argo CD plugin (helm-secrets / kustomize-sops)
#
# Whichever path you pick, the resulting in-cluster Secret should expose
# exactly these keys — the Deployment references them as envFrom.
#
# Two valid configurations:
#
#   A) Minimal (KV-driven) — the app reads everything else from Azure KV
#      at startup.  Set:
#        AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#      and ensure ConfigMap.AZURE_KEYVAULT_URL is set.  Leave the rest
#      empty / unset; KV provides them.
#
#   B) Full env-var injection — set every secret below directly.  KV may
#      be left disabled (AZURE_KEYVAULT_URL="") in this case.
apiVersion: v1
kind: Secret
metadata:
  name: payswitch-secrets
  namespace: payswitch-credit-scoring
type: Opaque
stringData:
  # ── Azure Key Vault service principal (always required if KV is enabled)
  AZURE_TENANT_ID: "00000000-0000-0000-0000-000000000000"
  AZURE_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
  AZURE_CLIENT_SECRET: "REPLACE_ME"

  # ── Database / cache / message bus (or fetch from KV — see config A above)
  DATABASE_URL: "postgresql+asyncpg://user:pass@host:5432/credit_scoring?ssl=require"
  REDIS_URL: "rediss://:KEY@host:6380/0"
  AZURE_SERVICEBUS_CONNECTION_STRING: "Endpoint=sb://...;SharedAccessKey=..."
  AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=...;AccountKey=..."
  CHAMPION_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=...;AccountKey=..."

  # ── Auth
  JWT_SECRET_KEY: "REPLACE_ME_WITH_RANDOM_64_CHAR_STRING"

  # ── External services
  XDS_USERNAME: "REPLACE_ME"
  XDS_PASSWORD: "REPLACE_ME"
  DE_INFERENCE_CODE: "REPLACE_ME"
  ORCHESTRATOR_FUNCTION_KEY: "REPLACE_ME"
  CUSTOMER_SERVICE_FUNCTION_KEY: ""

  # ── Email
  RESEND_API_KEY: ""

  # ── Bootstrap admin (rotate via dashboard immediately after first login)
  BOOTSTRAP_ADMIN_PASSWORD: "REPLACE_ME"
